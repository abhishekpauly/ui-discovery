[project]
name = "ui-discovery"
version = "0.18.0"
description = "Framework-agnostic UI Discovery Engine — crawl, analyze, probe, diff and document a web UI"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.56.0",
    "pydantic==2.13.3",
    "crawlee[playwright]==1.9.1",
    # Scope configs (H5/R2/S1). Pure data, no network, no AI — JSON configs
    # work without it, but YAML is the documented format.
    # 6.0.3 is the first release with a Python 3.14 wheel; 6.0.2 tries to
    # build from source and fails there.
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    # CI shards the browser suite across runners by recorded durations.
    "pytest-split==0.10.0",
    "ruff==0.9.6",
]
# V5 ONLY — the quarantined home for optional AI/LLM enrichment (semantic
# classification, doc/QA generation). The core NEVER depends on these; the full
# test suite must pass with this extra NOT installed. Add providers here when V5
# is built. Enforced by tests/test_no_ai_runtime.py.
semantic = [
    # e.g. "anthropic>=0.40" — add only when implementing V5, never to `dependencies`.
]

[project.scripts]
ui-discovery-extract = "ui_discovery.extract:main"
ui-discovery-crawl = "ui_discovery.crawl:main"
ui-discovery-analyze = "ui_discovery.analyze:main"
ui-discovery-diff = "ui_discovery.diff:main"
ui-discovery-intake = "ui_discovery.intake:main"
ui-discovery-sourcescan = "ui_discovery.sourcescan:main"
ui-discovery-pipeline = "ui_discovery.pipeline:main"
ui-discovery-probe = "ui_discovery.probe:main"
ui-discovery-login = "ui_discovery.login:main"
ui-discovery-semantic = "ui_discovery.semantic:main"
ui-discovery-docgen = "ui_discovery.docgen:main"
ui-discovery-qagen = "ui_discovery.qagen:main"

[tool.pytest.ini_options]
markers = [
    "browser: needs a real Chromium (applied automatically; see tests/conftest.py)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow to start: real bugs and import hygiene, not style
# opinions on a codebase that has never been linted.
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line length is enforced by review, not by a hard failure
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Pinned tooling versions (record for reproducibility):
#   Python      3.11.15
#   Playwright  1.56.0   (browser: Chromium)
#   Pydantic    2.13.3
#   Crawlee     1.9.1    (crawlee[playwright])
