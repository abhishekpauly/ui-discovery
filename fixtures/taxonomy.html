<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><title>Taxonomy fixture</title></head>
<body>
  <header><h1>Types</h1></header>
  <nav aria-label="Breadcrumb"><a href="/a">Home</a></nav>
  <nav aria-label="Primary"><a href="/b">Section</a></nav>
  <aside aria-label="Filters">Sidebar</aside>
  <main>
    <div role="tablist"><button role="tab" aria-selected="true">One</button></div>
    <details><summary>More</summary><p>Body</p></details>
    <input type="range" aria-label="Volume" />
    <input type="file" aria-label="Upload" />
    <input type="search" aria-label="Find" />
    <input type="date" aria-label="When" />
    <div contenteditable="true" aria-label="Notes">Rich text</div>
    <table><tr><th aria-sort="ascending">Name</th></tr></table>
    <progress value="3" max="10"></progress>
    <div role="alert">Something failed</div>
    <div role="status" aria-live="polite">Saved</div>
    <div role="dialog" aria-modal="true" aria-label="Confirm">Modal</div>
    <div role="dialog" aria-label="Panel">Drawer</div>
    <a href="https://x.test" target="_blank">External</a>
    <a href="/f.csv" download>Download</a>
    <canvas aria-label="Chart"></canvas>
    <div role="region" aria-roledescription="carousel" aria-label="Gallery">Carousel</div>
  </main>
</body>
</html>
