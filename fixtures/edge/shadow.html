<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><title>Shadow DOM</title></head>
<body>
  <main>
    <h1>Shadow DOM host page</h1>

    <!-- Light DOM control: always been visible to the extractor. -->
    <button id="light-btn">Light button</button>

    <!-- OPEN shadow root: its contents must be extracted. -->
    <open-widget id="open-host"></open-widget>

    <!-- NESTED open shadow roots: an open root inside an open root. -->
    <outer-widget id="outer-host"></outer-widget>

    <!-- CLOSED shadow root: not reachable by standards, must NOT appear. -->
    <closed-widget id="closed-host"></closed-widget>
  </main>

  <script>
    customElements.define("open-widget", class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `
          <nav aria-label="Widget nav"><a href="/shadow-link">Shadow link</a></nav>
          <button id="shadow-btn">Shadow button</button>
          <button id="shadow-hidden" style="display:none">Hidden shadow button</button>
          <input id="shadow-input" type="text" aria-label="Shadow input" />
        `;
      }
    });

    customElements.define("inner-widget", class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `<button id="nested-btn">Nested shadow button</button>`;
      }
    });

    customElements.define("outer-widget", class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `<div><inner-widget></inner-widget></div>`;
      }
    });

    customElements.define("closed-widget", class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "closed" });
        root.innerHTML = `<button id="closed-btn">Closed shadow button</button>`;
      }
    });
  </script>
</body>
</html>
