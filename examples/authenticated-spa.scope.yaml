# A large authenticated SPA — the shape of config that survives contact with
# a real portal.
#
# Measured on one: 18 screens, 98 revealed states, 13 component crops, 35 API
# endpoints, in ~13 minutes. Three things in here are the lessons that run
# taught, and they are the reason this file exists:
#
#   * the `exclude` patterns — a builder-style portal has one screen per saved
#     app or agent. Without them, eleven of the first twenty-five screens were
#     the same screen with a different uuid, and the page budget was spent on
#     nothing.
#   * `adapters: extra_wait` — this class of app holds a websocket open, so
#     `networkidle` never fires and the generic DOM-plateau check cannot tell
#     "finished" from "between fetches".
#   * `politeness` — a shared QA environment. A capture is not worth an
#     incident.
#
# Copy it, change `start_url` and the module URLs.

target: Acme-Portal
start_url: https://portal.example.com/platform/dashboard
environment: staging
authorized: true
authorized_by: your-name

auth:
  required: true
  state_file: session.json

budget:
  max_pages: 20
  max_depth: 3
  max_interactions: 40

scope:
  exclude:
    # One builder screen per saved app/agent. Capturing every instance
    # documents nothing the first one did not.
    - "/platform/app-builder/**"
    - "/platform/agent-builder/**"

identity:
  # A builder portal puts ids in the path and noise in the query; collapse the
  # noise so two views of one screen are one screen.
  dedupe_queries: true

capabilities:
  screenshots: true
  accessibility_tree: true
  probe: true

probe:
  state_capture: true          # photograph modals, menus, tab panels
  component_screenshots: true  # crop forms, dialogs, tables, panels
  tabs: all
  # tabs: listed               # ...or open only the ones that matter
  # tab_labels: [Overview, Activity]
  # tab_exclude: [Audit Log]   # heavy, and on every screen

politeness:
  max_requests_per_minute: 90
  max_concurrency: 1

safety:
  # Additive only: config can make the engine more cautious, never less.
  never_touch:
    - "#danger-zone"

adapters:
  - name: extra_wait
    options: { ms: 4000 }

modules:
  # Named so each area gets its own self-contained folder, and so the probe
  # can be tuned per area later.
  - name: Knowledge-Hub
    start_url: https://portal.example.com/platform/knowledge-store
  - name: Model-Hub
    start_url: https://portal.example.com/platform/model-hub
    # This module is heavy; read it, never click it.
    # probe:
    #   enabled: false

outputs:
  keep_history: true   # dated folder, so this run can be diffed against the next
  run_label: Acme-Portal
