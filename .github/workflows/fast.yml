# The 60-second answer.
#
# The full suite is browser-heavy and takes ~18 minutes locally. Waiting that
# long to learn about a typo, an unused import or a config key nothing reads is
# the slow path this lane exists to remove. Everything here runs without
# launching Chromium.
name: fast

on:
  push:
    # Sprint integration branches are shared and long-ish lived, so they are
    # kept green in their own right rather than only at pull-request time.
    branches: [main, "sprint/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what pyproject records as the pinned toolchain; 3.14 is what
        # the engine is developed on. Testing both is what stops them drifting
        # apart silently.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # `test_release_hygiene`'s drift guard finds the release commit with
          # `git log -S`, which a shallow clone cannot see — so it skipped on
          # every run and gated nothing, which is how four items reached this
          # branch past a limit of three. Full history costs a second or two on
          # a repo this size and is what makes the guard real.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests that need no browser
        run: pytest -m "not browser" -q
